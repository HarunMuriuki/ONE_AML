# ================= Neo4j =================
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password123}

# ================= Model / pipelines (files, not code) =================
neo.model.dir=${NEO_MODEL_DIR:model}

# ================= Rules (Oracle data dictionary scan) =================
# OWNER.TABLE list; add a table here (or pass ?tables= to refresh) to include it.
rules.tables=${NEO_RULES_TABLES:TBAADM.GAM,TBAADM.SMT,TBAADM.SOL,TBAADM.GSM,TBAADM.HTD,TBAADM.DTD,TBAADM.CTD_DTD_ACLI_VIEW,CRMUSER.ACCOUNTS,CRMUSER.DEMOGRAPHIC}
rules.max-rows=2000

# ================= ETL / scoring tunables =================
graph.sync.enabled=true
graph.sync.batch-size=5000
graph.sync.max-rows=5000
graph.sync.query-timeout-seconds=60
graph.aml.large-amount-kes=${AML_LARGE_AMOUNT_KES:1500000}
graph.aml.structuring-low-kes=${AML_STRUCTURING_LOW_KES:1100000}
graph.aml.velocity-count=${AML_VELOCITY_COUNT:5}
graph.aml.velocity-window-minutes=${AML_VELOCITY_WINDOW_MINUTES:60}

# ================= API docs =================
springdoc.swagger-ui.path=/swagger-ui.html
